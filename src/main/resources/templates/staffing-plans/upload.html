<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка кадрового плана</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-upload me-2"></i>Загрузка кадрового плана</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/staffing-plans/upload}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="file" class="form-label">Выберите JSON-файл</label>
                            <input type="file" class="form-control" id="file" name="file" accept=".json" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-cloud-upload"></i> Загрузить
                        </button>
                        <a href="/staffing-plans/list" class="btn btn-outline-secondary">
                            <i class="bi bi-list"></i> Просмотр планов
                        </a>
                        <a href="/calculations" class="btn btn-outline-success">
                            <i class="bi bi-calculator"></i> Перейти к расчёту
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
