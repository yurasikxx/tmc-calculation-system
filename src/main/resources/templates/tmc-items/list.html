<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список ТМЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Список товарно-материальных ценностей</h2>
        <a href="/tmc-items/create" class="btn btn-primary">Добавить ТМЦ</a>
    </div>

    <div class="mb-3">
        <form method="get" class="row g-3 align-items-center">
            <div class="col-auto">
                <label for="typeFilter" class="col-form-label">Тип:</label>
            </div>
            <div class="col-auto">
                <select class="form-select" id="typeFilter" name="type" onchange="this.form.submit()">
                    <option value="">Все</option>
                    <option value="SIZ" th:selected="${selectedType == 'SIZ'}">СИЗ</option>
                    <option value="TOOL" th:selected="${selectedType == 'TOOL'}">Инструмент</option>
                    <option value="EQUIPMENT" th:selected="${selectedType == 'EQUIPMENT'}">Оснастка</option>
                </select>
            </div>
            <div class="col-auto">
                <a href="/tmc-items" class="btn btn-secondary">Сбросить</a>
            </div>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Код</th>
                <th>Наименование</th>
                <th>Тип</th>
                <th>Ед. изм.</th>
                <th>Срок службы (мес.)</th>
                <th style="width: 200px;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${tmcItems}">
                <td th:text="${item.id}">1</td>
                <td th:text="${item.code}">С00000001</td>
                <td th:text="${item.name}">Костюм мужской х/б</td>
                <td>
                        <span th:classappend="${item.type.name == 'SIZ'} ? 'bg-success' : (${item.type.name == 'TOOL'} ? 'bg-primary' : 'bg-warning')"
                              class="badge">
                            <span th:text="${@tmcTypeService.getRussianName(item.type.name)}">СИЗ</span>
                        </span>
                </td>
                <td th:text="${item.unit.code}">шт</td>
                <td th:text="${item.serviceLifeMonths}">24</td>
                <td>
                    <a th:href="@{/tmc-items/edit/{id}(id=${item.id})}" class="btn btn-sm btn-warning">Изменить</a>
                    <form th:action="@{/tmc-items/delete/{id}(id=${item.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Удалить ТМЦ?')">
                            Удалить
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${tmcItems.isEmpty()}">
                <td colspan="7" class="text-center text-muted">Нет ТМЦ</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
