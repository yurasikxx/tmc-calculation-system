<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список ТМЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Список товарно-материальных ценностей</h2>
        <a href="/tmc-items/create" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Добавить ТМЦ
        </a>
    </div>

    <div class="row mb-3 g-2 align-items-end">
        <div class="col-md-3">
            <form method="get" id="filterForm">
                <label for="typeFilter" class="form-label">Тип</label>
                <select class="form-select" id="typeFilter" name="type" onchange="this.form.submit()">
                    <option value="">Все</option>
                    <option value="SIZ" th:selected="${selectedType == 'SIZ'}">СИЗ</option>
                    <option value="TOOL" th:selected="${selectedType == 'TOOL'}">Инструмент</option>
                    <option value="EQUIPMENT" th:selected="${selectedType == 'EQUIPMENT'}">Оснастка</option>
                </select>
            </form>
        </div>
        <div class="col-md-3">
            <form method="get" id="searchForm">
                <label for="searchInput" class="form-label">Поиск</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" name="search"
                           placeholder="Код или наименование" th:value="${searchQuery}">
                    <button type="submit" class="btn btn-outline-primary">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>
        </div>
        <div class="col-md-2">
            <form method="get" id="sizeForm">
                <label for="sizeSelect" class="form-label">Записей на странице</label>
                <select class="form-select" id="sizeSelect" name="size" onchange="this.form.submit()">
                    <option value="5" th:selected="${size == 5}">5</option>
                    <option value="10" th:selected="${size == 10}">10</option>
                    <option value="25" th:selected="${size == 25}">25</option>
                    <option value="50" th:selected="${size == 50}">50</option>
                    <option value="100" th:selected="${size == 100}">100</option>
                </select>
            </form>
        </div>
        <div class="col-md-2 text-end">
            <a href="/tmc-items" class="btn btn-secondary">
                <i class="bi bi-arrow-counterclockwise"></i> Сбросить
            </a>
        </div>
        <div class="col-md-2 text-end">
            <span class="text-muted">
                Всего: <strong th:text="${totalItems}">0</strong>
            </span>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>
                    <a th:href="@{/tmc-items(page=${currentPage}, size=${size}, sortBy='id', sortDir=${reverseSortDir}, type=${selectedType}, search=${searchQuery})}"
                       class="text-decoration-none text-dark">
                        ID
                        <i th:if="${sortBy == 'id'}"
                           th:class="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/tmc-items(page=${currentPage}, size=${size}, sortBy='code', sortDir=${reverseSortDir}, type=${selectedType}, search=${searchQuery})}"
                       class="text-decoration-none text-dark">
                        Код
                        <i th:if="${sortBy == 'code'}"
                           th:class="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/tmc-items(page=${currentPage}, size=${size}, sortBy='name', sortDir=${reverseSortDir}, type=${selectedType}, search=${searchQuery})}"
                       class="text-decoration-none text-dark">
                        Наименование
                        <i th:if="${sortBy == 'name'}"
                           th:class="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/tmc-items(page=${currentPage}, size=${size}, sortBy='type.id', sortDir=${reverseSortDir}, type=${selectedType}, search=${searchQuery})}"
                       class="text-decoration-none text-dark">
                        Тип
                        <i th:if="${sortBy == 'type.id'}"
                           th:class="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/tmc-items(page=${currentPage}, size=${size}, sortBy='unit.id', sortDir=${reverseSortDir}, type=${selectedType}, search=${searchQuery})}"
                       class="text-decoration-none text-dark">
                        Ед. изм.
                        <i th:if="${sortBy == 'unit.id'}"
                           th:class="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/tmc-items(page=${currentPage}, size=${size}, sortBy='serviceLifeMonths', sortDir=${reverseSortDir}, type=${selectedType}, search=${searchQuery})}"
                       class="text-decoration-none text-dark">
                        Срок службы (мес.)
                        <i th:if="${sortBy == 'serviceLifeMonths'}"
                           th:class="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                    </a>
                </th>
                <th style="width: 200px;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${tmcItems}">
                <td th:text="${item.id}">1</td>
                <td th:text="${item.code}">С00000001</td>
                <td th:text="${item.name}">Костюм мужской х/б</td>
                <td>
                        <span th:classappend="${item.type.name == 'SIZ'} ? 'bg-success' : (${item.type.name == 'TOOL'} ? 'bg-primary' : 'bg-warning')"
                              class="badge">
                            <span th:text="${@tmcTypeService.getRussianName(item.type.name)}">СИЗ</span>
                        </span>
                </td>
                <td th:text="${item.unit.code}">шт</td>
                <td th:text="${item.serviceLifeMonths}">24</td>
                <td>
                    <a th:href="@{/tmc-items/edit/{id}(id=${item.id})}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{/tmc-items/delete/{id}(id=${item.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Удалить ТМЦ?')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${tmcItems.isEmpty()}">
                <td colspan="7" class="text-center text-muted">Нет ТМЦ</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                <a class="page-link"
                   th:href="@{/tmc-items(page=${currentPage - 1}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, type=${selectedType}, search=${searchQuery})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                class="page-item" th:classappend="${pageNum == currentPage} ? 'active' : ''">
                <a class="page-link"
                   th:href="@{/tmc-items(page=${pageNum}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, type=${selectedType}, search=${searchQuery})}"
                   th:text="${pageNum + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                <a class="page-link"
                   th:href="@{/tmc-items(page=${currentPage + 1}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, type=${selectedType}, search=${searchQuery})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
