<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список ТМЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Список товарно-материальных ценностей</h2>
        <a href="/tmc-items/create" class="btn btn-primary">Добавить ТМЦ</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Код</th>
            <th>Наименование</th>
            <th>Тип</th>
            <th>Ед. изм.</th>
            <th style="width: 200px;">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${tmcItems}">
            <td th:text="${item.id}">1</td>
            <td th:text="${item.code}">SIZ-001</td>
            <td th:text="${item.name}">Костюм мужской х/б</td>
            <td><span class="badge"
                      th:classappend="${item.type.name == 'SIZ'} ? 'bg-success' : ${item.type.name == 'TOOL'} ? 'bg-primary' : 'bg-warning'"
                      th:text="${item.type.name}">СИЗ</span></td>
            <td th:text="${item.unit}">компл</td>
            <td>
                <a th:href="@{/tmc-items/edit/{id}(id=${item.id})}" class="btn btn-sm btn-warning">Изменить</a>
                <form th:action="@{/tmc-items/delete/{id}(id=${item.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Удалить ТМЦ? Если на него есть нормы, удаление будет запрещено.')">
                        Удалить
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${tmcItems.isEmpty()}">
            <td colspan="6" class="text-center text-muted">Нет ТМЦ</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
