<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tmcItem.id == null} ? 'Создание ТМЦ' : 'Редактирование ТМЦ'">ТМЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 th:text="${tmcItem.id == null} ? 'Создание ТМЦ' : 'Редактирование ТМЦ'">ТМЦ</h2>

            <form th:action="${tmcItem.id == null} ? @{/tmc-items/create} : @{/tmc-items/edit/{id}(id=${tmcItem.id})}"
                  th:object="${tmcItem}" method="post">

                <div class="mb-3">
                    <label class="form-label">Код</label>
                    <input type="text" class="form-control" th:field="*{code}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Наименование</label>
                    <input type="text" class="form-control" th:field="*{name}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Тип ТМЦ</label>
                    <select class="form-select" id="typeSelect" th:field="*{type.id}" required>
                        <option value="">Выберите тип</option>
                        <option th:each="t : ${tmcTypes}"
                                th:value="${t.id}"
                                th:attr="data-type=${t.name}"
                                th:text="${@tmcTypeService.getRussianName(t.name)}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Единица измерения</label>
                    <select class="form-select" th:field="*{unit.id}" required>
                        <option value="">Выберите единицу</option>
                        <option th:each="u : ${units}"
                                th:value="${u.id}"
                                th:text="${u.code + ' — ' + u.name}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Срок службы (мес.)</label>
                    <input type="number" class="form-control" th:field="*{serviceLifeMonths}" min="1">
                </div>

                <div id="sizAttrs" class="attribute-block mb-3" style="display: none;">
                    <h5>Атрибуты СИЗ</h5>
                    <div class="mb-3">
                        <label class="form-label">Размер</label>
                        <input type="text" class="form-control" name="size"
                               th:value="${sizAttributes.size}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Срок носки (мес.)</label>
                        <input type="number" class="form-control" name="wearPeriodMonths"
                               th:value="${sizAttributes.wearPeriodMonths}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Класс защиты</label>
                        <input type="text" class="form-control" name="protectionClass"
                               th:value="${sizAttributes.protectionClass}">
                    </div>
                </div>

                <div id="toolAttrs" class="attribute-block mb-3" style="display: none;">
                    <h5>Атрибуты инструмента</h5>
                    <div class="mb-3">
                        <label class="form-label">Материал</label>
                        <input type="text" class="form-control" name="material"
                               th:value="${toolAttributes.material}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ГОСТ</label>
                        <input type="text" class="form-control" name="gostNumber"
                               th:value="${toolAttributes.gostNumber}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Диапазон измерения</label>
                        <input type="text" class="form-control" name="measurementRange"
                               th:value="${toolAttributes.measurementRange}">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Сохранить
                </button>
                <a href="/tmc-items" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Отмена
                </a>
            </form>
        </div>
    </div>
</div>

<script>
    (function () {
        const typeSelect = document.getElementById('typeSelect');
        const blocks = {
            SIZ: document.getElementById('sizAttrs'),
            TOOL: document.getElementById('toolAttrs')
        };

        function refreshBlocks() {
            const selected = typeSelect.options[typeSelect.selectedIndex];
            const type = selected ? selected.getAttribute('data-type') : null;

            Object.values(blocks).forEach(b => b && (b.style.display = 'none'));
            if (type && blocks[type]) blocks[type].style.display = 'block';
        }

        typeSelect.addEventListener('change', refreshBlocks);
        refreshBlocks();
    })();
</script>
</body>
</html>
