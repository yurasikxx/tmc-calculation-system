<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выдача ТМЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"
          rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Выдача ТМЦ сотруднику</h2>

            <form th:action="@{/issued-items/issue}" method="post" class="needs-validation" novalidate>

                <div class="mb-3">
                    <label for="employeeId" class="form-label">Сотрудник</label>
                    <select class="form-select" id="employeeId" name="employeeId" required>
                        <option value="">Выберите сотрудника</option>
                        <option th:each="emp : ${employees}"
                                th:value="${emp.id}"
                                th:text="${emp.fullName} + ' (' + ${emp.profession.name} + ')'"></option>
                    </select>
                    <div class="invalid-feedback">Выберите сотрудника</div>
                </div>

                <div class="mb-3">
                    <label for="tmcItemId" class="form-label">ТМЦ</label>
                    <select class="form-select" id="tmcItemId" name="tmcItemId" required>
                        <option value="">Сначала выберите сотрудника</option>
                    </select>
                    <div class="form-text">
                        Показаны только ТМЦ, положенные по норме профессии
                        и ещё не выданные этому сотруднику.
                    </div>
                    <div class="invalid-feedback">Выберите ТМЦ</div>
                </div>

                <div class="mb-3">
                    <label for="quantity" class="form-label">Количество</label>
                    <input type="number" class="form-control" id="quantity" name="quantity"
                           min="1" value="1" required>
                    <div class="invalid-feedback">Укажите количество</div>
                </div>

                <div class="mb-3">
                    <label for="issueDate" class="form-label">Дата выдачи</label>
                    <input type="date" class="form-control" id="issueDate" name="issueDate"
                           th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                    <div class="form-text">
                        Дата окончания срока службы рассчитывается автоматически
                        по сроку службы ТМЦ.
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Выдать
                </button>
                <a href="/issued-items" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Отмена
                </a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function () {
        const $emp = $('#employeeId');
        const $tmc = $('#tmcItemId');

        $emp.select2({
            theme: 'bootstrap-5',
            placeholder: 'Начните вводить ФИО',
            allowClear: true
        });
        $tmc.select2({
            theme: 'bootstrap-5',
            placeholder: 'Выберите ТМЦ',
            allowClear: true
        });

        function reloadTmc(employeeId) {
            if (!employeeId) {
                $tmc.empty().append('<option value="">Сначала выберите сотрудника</option>');
                $tmc.trigger('change');
                return;
            }

            $tmc.empty().append('<option value="">Загрузка…</option>');
            $tmc.trigger('change');

            fetch('/issued-items/available-tmc?employeeId=' + encodeURIComponent(employeeId))
                .then(r => r.json())
                .then(items => {
                    $tmc.empty();
                    $tmc.append('<option value="">Выберите ТМЦ</option>');
                    if (items.length === 0) {
                        $tmc.append('<option value="" disabled>Нет доступных ТМЦ по норме</option>');
                    } else {
                        items.forEach(i => {
                            const opt = new Option(i.code + ' — ' + i.name, i.id);
                            $tmc.append(opt);
                        });
                    }
                    $tmc.trigger('change');
                })
                .catch(err => {
                    console.error('Ошибка загрузки ТМЦ:', err);
                    $tmc.empty().append('<option value="">Ошибка загрузки</option>');
                    $tmc.trigger('change');
                });
        }

        $emp.on('change', function () {
            reloadTmc($(this).val());
        });

        reloadTmc($emp.val());
    });

    (() => {
        'use strict';
        document.querySelectorAll('.needs-validation').forEach(form => {
            form.addEventListener('submit', e => {
                if (!form.checkValidity()) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
