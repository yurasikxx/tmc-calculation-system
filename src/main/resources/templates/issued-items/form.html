<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выдача ТМЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Выдача ТМЦ сотруднику</h2>

            <form th:action="@{/issued-items/issue}" method="post" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="employeeId" class="form-label">Сотрудник</label>
                    <select class="form-select" id="employeeId" name="employeeId" required>
                        <option value="">Выберите сотрудника</option>
                        <option th:each="emp : ${employees}"
                                th:value="${emp.id}"
                                th:text="${emp.fullName} + ' (' + ${emp.profession.name} + ')'"
                                th:disabled="${emp.terminationDate != null}">
                        </option>
                    </select>
                    <div class="invalid-feedback">Выберите сотрудника</div>
                </div>

                <div class="mb-3">
                    <label for="tmcItemId" class="form-label">ТМЦ</label>
                    <select class="form-select" id="tmcItemId" name="tmcItemId" required>
                        <option value="">Выберите ТМЦ</option>
                        <option th:each="item : ${tmcItems}"
                                th:value="${item.id}"
                                th:text="${item.code + ' - ' + item.name}">
                        </option>
                    </select>
                    <div class="invalid-feedback">Выберите ТМЦ</div>
                </div>

                <div class="mb-3">
                    <label for="quantity" class="form-label">Количество</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" min="1" value="1" required>
                    <div class="invalid-feedback">Укажите количество</div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Выдать
                </button>
                <a href="/issued-items" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Отмена
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
