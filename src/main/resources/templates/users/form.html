<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:if="${user.id == null}">Создание пользователя</title>
    <title th:if="${user.id != null}">Редактирование пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 th:if="${user.id == null}">Новый пользователь</h2>
            <h2 th:if="${user.id != null}">Редактирование пользователя</h2>

            <form th:action="${user.id == null} ? @{/users/create} : @{/users/edit/{id}(id=${user.id})}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Логин</label>
                    <input type="text" class="form-control" id="username" name="username" th:value="${user.username}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="passwordHash" class="form-label">
                        <span th:if="${user.id == null}">Пароль</span>
                        <span th:if="${user.id != null}">Новый пароль (оставьте пустым, чтобы не менять)</span>
                    </label>
                    <input type="password" class="form-control" id="passwordHash" name="passwordHash">
                </div>

                <div class="mb-3">
                    <label for="roleId" class="form-label">Роль</label>
                    <select class="form-select" id="roleId" name="roleId" required>
                        <option value="">Выберите роль</option>
                        <option th:each="role : ${roles}"
                                th:value="${role.id}"
                                th:text="${@userService.getRussianRoleName(role.name)}"
                                th:selected="${user.role != null && user.role.id == role.id}">
                            Роль
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Сотрудник (необязательно)</label>

                    <div class="row g-2">
                        <div class="col-6 position-relative">
                            <input type="text" class="form-control" id="employeeSearch"
                                   placeholder="Начните вводить ФИО сотрудника"
                                   autocomplete="off">
                            <div id="employeeSuggestions" class="list-group position-absolute"
                                 style="display: none; z-index: 1000; max-height: 200px; overflow-y: auto; width: 100%;">
                            </div>
                        </div>
                        <div class="col-6">
                            <input type="text" class="form-control" id="selectedEmployeeDisplay"
                                   placeholder="Выбранный сотрудник" readonly>
                        </div>
                    </div>

                    <input type="hidden" id="employeeId" name="employeeId"
                           th:value="${user.employee != null ? user.employee.id : ''}">
                    <div class="form-text">Введите ФИО, выберите сотрудника из списка</div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Сохранить
                </button>
                <a href="/users" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Отмена
                </a>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.employeeData = /*[[${employees}]]*/ [];
    /*]]>*/
</script>

<script src="/js/employee-search.js"></script>

</body>
</html>
