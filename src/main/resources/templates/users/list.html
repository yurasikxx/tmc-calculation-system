<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Пользователи системы</h2>
        <a href="/users/create" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Добавить пользователя
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Логин</th>
                <th>Роль</th>
                <th>Сотрудник</th>
                <th>Статус</th>
                <th style="width: 300px;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">admin</td>
                <td th:text="${@userService.getRussianRoleName(user.role.name)}">Администратор</td>
                <td th:text="${user.employee != null ? user.employee.fullName : '-'}">Иванов И.И.</td>
                <td>
                        <span th:classappend="${user.isActive} ? 'bg-success' : 'bg-secondary'" class="badge">
                            <span th:text="${user.isActive} ? 'Активен' : 'Заблокирован'">Активен</span>
                        </span>
                </td>
                <td>
                    <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i> Изменить
                    </a>
                    <form th:action="@{/users/toggle/{id}(id=${user.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm"
                                th:classappend="${user.isActive} ? 'btn-secondary' : 'btn-success'">
                            <i th:classappend="${user.isActive} ? 'bi bi-lock' : 'bi bi-unlock'"></i>
                            <span th:text="${user.isActive} ? 'Блок' : 'Акт'">Блок</span>
                        </button>
                    </form>
                    <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger"
                                onclick="return confirm('Удалить пользователя?')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.isEmpty()}">
                <td colspan="6" class="text-center text-muted">Нет пользователей</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
