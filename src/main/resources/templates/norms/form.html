<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:if="${norm.id == null}">Создание нормы выдачи</title>
    <title th:if="${norm.id != null}">Редактирование нормы выдачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 th:if="${norm.id == null}">Новая норма выдачи</h2>
            <h2 th:if="${norm.id != null}">Редактирование нормы выдачи</h2>

            <form th:action="${norm.id == null} ? @{/norms/create} : @{/norms/edit/{id}(id=${norm.id})}" method="post">
                <div class="mb-3">
                    <label for="tmcItem" class="form-label">ТМЦ</label>
                    <select class="form-select" id="tmcItem" name="tmcItem.id" required>
                        <option value="">Выберите ТМЦ</option>
                        <option th:each="item : ${tmcItems}" th:value="${item.id}"
                                th:text="${item.code + ' - ' + item.name}"
                                th:selected="${norm.tmcItem != null && norm.tmcItem.id == item.id}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="profession" class="form-label">Профессия</label>
                    <select class="form-select" id="profession" name="profession.id" required>
                        <option value="">Выберите профессию</option>
                        <option th:each="prof : ${professions}" th:value="${prof.id}" th:text="${prof.name}"
                                th:selected="${norm.profession != null && norm.profession.id == prof.id}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="quantity" class="form-label">Количество</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" th:value="${norm.quantity}"
                           min="1" required>
                </div>

                <div class="mb-3">
                    <label for="periodMonths" class="form-label">Период (месяцев)</label>
                    <input type="number" class="form-control" id="periodMonths" name="periodMonths"
                           th:value="${norm.periodMonths}" min="1" required>
                    <div class="form-text">Например: 24 (на 2 года), 1 (ежемесячно)</div>
                </div>

                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/norms" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
