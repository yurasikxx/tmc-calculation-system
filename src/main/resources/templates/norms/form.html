<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Норма выдачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 th:text="${norm.id == null} ? 'Создание нормы' : 'Редактирование нормы'">Норма</h2>

            <form th:action="${norm.id == null} ? @{/norms/create} : @{/norms/edit/{id}(id=${norm.id})}"
                  th:object="${norm}" method="post">

                <div class="mb-3">
                    <label class="form-label">ТМЦ</label>
                    <select class="form-select" th:field="*{tmcItem.id}" required>
                        <option value="">Выберите ТМЦ</option>
                        <option th:each="item : ${tmcItems}"
                                th:value="${item.id}"
                                th:text="${item.code + ' — ' + item.name}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Профессия</label>
                    <select class="form-select" th:field="*{profession.id}" required>
                        <option value="">Выберите профессию</option>
                        <option th:each="p : ${professions}"
                                th:value="${p.id}"
                                th:text="${p.name}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Количество</label>
                    <input type="number" class="form-control" th:field="*{quantity}" min="1" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Период (мес.)</label>
                    <input type="number" class="form-control" th:field="*{periodMonths}" min="1" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Сохранить
                </button>
                <a href="/norms" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Отмена
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
