<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нормы выдачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Нормы выдачи ТМЦ</h2>
        <a sec:authorize="hasAnyRole('OT', 'TECHNOLOG', 'ADMIN')"
           href="/norms/create" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Добавить норму
        </a>
    </div>

    <div class="row mb-3 g-2 align-items-end">
        <div class="col-md-3">
            <form method="get">
                <label class="form-label">Тип</label>
                <select class="form-select" name="type" onchange="this.form.submit()">
                    <option value="">Все доступные</option>
                    <option th:each="t : ${availableTypes}"
                            th:value="${t}"
                            th:selected="${selectedType == t}"
                            th:text="${t == 'SIZ' ? 'СИЗ' : (t == 'TOOL' ? 'Инструмент' : 'Оснастка')}"></option>
                </select>
            </form>
        </div>
        <div class="col-md-3">
            <form method="get">
                <label class="form-label">Поиск</label>
                <div class="input-group">
                    <input type="text" class="form-control" name="search"
                           placeholder="Профессия, ТМЦ, код" th:value="${searchQuery}">
                    <button type="submit" class="btn btn-outline-primary">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>
        </div>
        <div class="col-md-2">
            <form method="get">
                <label class="form-label">Записей</label>
                <select class="form-select" name="size" onchange="this.form.submit()">
                    <option value="25" th:selected="${size == 25}">25</option>
                    <option value="50" th:selected="${size == 50}">50</option>
                    <option value="100" th:selected="${size == 100}">100</option>
                </select>
            </form>
        </div>
        <div class="col-md-2">
            <a href="/norms" class="btn btn-secondary">
                <i class="bi bi-arrow-counterclockwise"></i> Сбросить
            </a>
        </div>
        <div class="col-md-2 text-end">
            <span class="text-muted">
                Всего: <strong th:text="${totalItems}">0</strong>
            </span>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>ТМЦ</th>
                <th>Профессия</th>
                <th class="text-end">Количество</th>
                <th class="text-end">Период (мес.)</th>
                <th style="width: 160px;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="norm : ${norms}">
                <td th:text="${norm.id}">1</td>
                <td>
                    <span th:text="${norm.tmcItem.code}">С00000001</span> —
                    <span th:text="${norm.tmcItem.name}">Костюм</span>
                </td>
                <td th:text="${norm.profession.name}">Токарь</td>
                <td class="text-end" th:text="${norm.quantity}">1</td>
                <td class="text-end" th:text="${norm.periodMonths}">24</td>
                <td>
                    <a sec:authorize="hasAnyRole('OT', 'TECHNOLOG', 'ADMIN')"
                       th:href="@{/norms/edit/{id}(id=${norm.id})}"
                       class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form sec:authorize="hasAnyRole('OT', 'TECHNOLOG', 'ADMIN')"
                          th:action="@{/norms/delete/{id}(id=${norm.id})}" method="post"
                          style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger"
                                onclick="return confirm('Удалить норму?')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${norms.isEmpty()}">
                <td colspan="6" class="text-center text-muted">Нет норм</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                <a class="page-link"
                   th:href="@{/norms(page=${currentPage - 1}, size=${size}, type=${selectedType}, search=${searchQuery})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                class="page-item" th:classappend="${p == currentPage} ? 'active' : ''">
                <a class="page-link"
                   th:href="@{/norms(page=${p}, size=${size}, type=${selectedType}, search=${searchQuery})}"
                   th:text="${p + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                <a class="page-link"
                   th:href="@{/norms(page=${currentPage + 1}, size=${size}, type=${selectedType}, search=${searchQuery})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
