<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список норм выдачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Нормы выдачи ТМЦ</h2>
        <a href="/norms/create" class="btn btn-primary">Добавить норму</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>ТМЦ</th>
            <th>Профессия</th>
            <th>Количество</th>
            <th>Период (мес.)</th>
            <th style="width: 200px;">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="norm : ${norms}">
            <td th:text="${norm.id}">1</td>
            <td th:text="${norm.tmcItem.type.name}">SIZ</td>
            <td th:text="${norm.tmcItem.name}">Штангенциркуль ШЦ-1</td>
            <td th:text="${norm.profession.name}">Токарь 5 разряда</td>
            <td th:text="${norm.quantity}">1</td>
            <td th:text="${norm.periodMonths}">24</td>
            <td>
                <a th:href="@{/norms/edit/{id}(id=${norm.id})}" class="btn btn-sm btn-warning">Изменить</a>
                <form th:action="@{/norms/delete/{id}(id=${norm.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Удалить норму?')">
                        Удалить
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${norms.isEmpty()}">
            <td colspan="6" class="text-center text-muted">Нет норм выдачи</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
