<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:if="${profession.id == null}">Создание профессии</title>
    <title th:if="${profession.id != null}">Редактирование профессии</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 th:if="${profession.id == null}">Новая профессия</h2>
            <h2 th:if="${profession.id != null}">Редактирование профессии</h2>

            <form th:action="${profession.id == null} ? @{/professions/create} : @{/professions/edit/{id}(id=${profession.id})}"
                  method="post" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="name" class="form-label">Название профессии</label>
                    <input type="text" class="form-control" id="name" name="name" th:value="${profession.name}"
                           required>
                    <div class="invalid-feedback">Пожалуйста, введите название профессии</div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Сохранить
                </button>
                <a href="/professions" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Отмена
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
