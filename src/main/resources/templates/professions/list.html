<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список профессий</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Список профессий</h2>
        <a href="/professions/create" class="btn btn-primary">Добавить профессию</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th style="width: 200px;">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prof : ${professions}">
            <td th:text="${prof.id}">1</td>
            <td th:text="${prof.name}">Токарь 5 разряда</td>
            <td>
                <a th:href="@{/professions/edit/{id}(id=${prof.id})}" class="btn btn-sm btn-warning">Изменить</a>
                <form th:action="@{/professions/delete/{id}(id=${prof.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Удалить профессию? Если на неё есть нормы, удаление будет запрещено.')">
                        Удалить
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${professions.isEmpty()}">
            <td colspan="3" class="text-center text-muted">Нет профессий</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
