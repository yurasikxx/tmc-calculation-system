<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">

<div class="login-card">
    <div class="text-center mb-4">
        <i class="bi bi-boxes icon"></i>
        <h2 class="brand mt-2">ТМЦ-система</h2>
        <p class="brand-sub">Войдите, чтобы продолжить</p>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3 input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" name="username" placeholder="Логин" required
                   autofocus>
        </div>
        <div class="mb-3 input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" placeholder="Пароль" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Войти
        </button>
    </form>

    <div th:if="${param.error}" class="alert alert-danger mt-3">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        Неверный логин или пароль
    </div>
    <div th:if="${param.logout}" class="alert alert-info mt-3">
        <i class="bi bi-info-circle-fill me-2"></i>
        Вы вышли из системы
    </div>

    <p class="text-center text-muted mt-4 small">
        <i class="bi bi-shield-lock me-1"></i>
        Защищённое соединение
    </p>
</div>

</body>
</html>
