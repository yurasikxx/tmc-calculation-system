<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:if="${department.id == null}">Создание подразделения</title>
    <title th:if="${department.id != null}">Редактирование подразделения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 th:if="${department.id == null}">Новое подразделение</h2>
            <h2 th:if="${department.id != null}">Редактирование подразделения</h2>

            <form th:action="${department.id == null} ? @{/departments/create} : @{/departments/edit/{id}(id=${department.id})}"
                  method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Название</label>
                    <input type="text" class="form-control" id="name" name="name" th:value="${department.name}"
                           required>
                </div>

                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/departments" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
