<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт потребности в ТМЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-calculator me-2"></i>Расчёт потребности в ТМЦ</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted">
                        Выберите период для расчёта потребности в ТМЦ на основе загруженного кадрового плана.
                    </p>

                    <form th:action="@{/calculations/run}" method="post">
                        <div class="mb-3">
                            <label for="month" class="form-label">Месяц</label>
                            <select class="form-select" id="month" name="month" required>
                                <option value="1">Январь</option>
                                <option value="2">Февраль</option>
                                <option value="3">Март</option>
                                <option value="4">Апрель</option>
                                <option value="5">Май</option>
                                <option value="6" selected>Июнь</option>
                                <option value="7">Июль</option>
                                <option value="8">Август</option>
                                <option value="9">Сентябрь</option>
                                <option value="10">Октябрь</option>
                                <option value="11">Ноябрь</option>
                                <option value="12">Декабрь</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="year" class="form-label">Год</label>
                            <input type="number" class="form-control" id="year" name="year" value="2026" min="2020"
                                   max="2030" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-play-fill"></i> Рассчитать
                            </button>
                            <a href="/staffing-plans/upload" class="btn btn-outline-secondary">
                                <i class="bi bi-upload"></i> Загрузить план
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
