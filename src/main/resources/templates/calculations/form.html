<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт потребности в ТМЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-calculator me-2"></i>Расчёт потребности в ТМЦ
                    </h4>
                </div>
                <div class="card-body">
                    <p class="text-muted">
                        Выберите период для расчёта потребности на основе загруженного кадрового плана.
                    </p>

                    <form th:action="@{/calculations/run}" method="post">
                        <div class="mb-3">
                            <label for="month" class="form-label">Месяц</label>
                            <select class="form-select" id="month" name="month" required>
                                <option th:each="m : ${months}"
                                        th:value="${m.value}"
                                        th:selected="${m.value == defaultMonth}"
                                        th:text="${m.label}">Ноябрь
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="year" class="form-label">Год</label>
                            <select class="form-select" id="year" name="year" required>
                                <option th:each="y : ${years}"
                                        th:value="${y}"
                                        th:selected="${y == defaultYear}"
                                        th:text="${y}">2026
                                </option>
                            </select>
                        </div>

                        <div class="d-flex gap-2 flex-wrap">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-play-fill"></i> Рассчитать
                            </button>
                            <a href="/staffing-plans/upload" class="btn btn-outline-primary">
                                <i class="bi bi-upload"></i> Загрузить план
                            </a>
                            <a href="/calculations/history" class="btn btn-outline-secondary">
                                <i class="bi bi-clock-history"></i> История расчётов
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
