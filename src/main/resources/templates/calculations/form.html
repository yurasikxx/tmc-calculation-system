<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт потребности в ТМЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Расчёт потребности в ТМЦ</h2>
            <p class="text-muted">Выберите месяц и год для расчёта потребности в ТМЦ на основе кадрового плана.</p>

            <form action="/calculations/run" method="post">
                <div class="mb-3">
                    <label for="month" class="form-label">Месяц</label>
                    <select class="form-select" id="month" name="month" required>
                        <option value="1">Январь</option>
                        <option value="2">Февраль</option>
                        <option value="3">Март</option>
                        <option value="4">Апрель</option>
                        <option value="5">Май</option>
                        <option value="6" selected>Июнь</option>
                        <option value="7">Июль</option>
                        <option value="8">Август</option>
                        <option value="9">Сентябрь</option>
                        <option value="10">Октябрь</option>
                        <option value="11">Ноябрь</option>
                        <option value="12">Декабрь</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="year" class="form-label">Год</label>
                    <input type="number" class="form-control" id="year" name="year" value="2026" min="2020" max="2030"
                           required>
                </div>

                <button type="submit" class="btn btn-primary">Рассчитать</button>
                <a href="/" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
