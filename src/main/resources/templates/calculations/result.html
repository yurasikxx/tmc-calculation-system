<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты расчёта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Результаты расчёта за <span th:text="${month} + '/' + ${year}">6/2026</span></h2>
        <div>
            <a href="/calculations" class="btn btn-secondary">Новый расчёт</a>
        </div>
    </div>

    <div th:if="${not report.isEmpty()}">
        <div class="alert alert-info">
            <strong>Всего позиций:</strong> <span th:text="${report.size()}">0</span>
        </div>
    </div>

    <div th:each="entry : ${groupedByType}">
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h4 th:text="${entry.key}">СИЗ</h4>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Код ТМЦ</th>
                        <th>Наименование</th>
                        <th>Ед. изм.</th>
                        <th class="text-end">Количество</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${entry.value}">
                        <td th:text="${item.tmcCode}">SIZ-001</td>
                        <td th:text="${item.tmcName}">Костюм мужской х/б</td>
                        <td th:text="${item.unit}">компл</td>
                        <td class="text-end" th:text="${item.requiredQuantity}">10</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:if="${report.isEmpty()}">
        <div class="alert alert-warning">
            <strong>Нет данных.</strong> За выбранный период нет кадровых изменений или не заданы нормы выдачи.
        </div>
    </div>
</div>

</body>
</html>
