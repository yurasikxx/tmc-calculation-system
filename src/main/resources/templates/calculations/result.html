<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты расчёта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Результаты расчёта за <span th:text="${month} + '/' + ${year}">6/2026</span></h2>
        <div>
            <a href="/calculations" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Новый расчёт
            </a>
            <button class="btn btn-success" disabled>
                <i class="bi bi-file-earmark-excel"></i> Экспорт в Excel
            </button>
        </div>
    </div>

    <div th:if="${not report.isEmpty()}">
        <div class="alert alert-info">
            <strong>Всего позиций:</strong> <span th:text="${report.size()}">0</span>
        </div>
    </div>

    <div th:each="entry : ${groupedByType}">
        <div class="card mb-4 shadow-sm">
            <div class="card-header"
                 th:classappend="${entry.key == 'SIZ'} ? 'bg-success text-white' : (${entry.key == 'TOOL'} ? 'bg-primary text-white' : 'bg-warning')">
                <h4 class="mb-0">
                    <span th:text="${@tmcTypeService.getRussianName(entry.key)}">СИЗ</span>
                    <span class="badge bg-light text-dark ms-2" th:text="${entry.value.size()} + ' позиций'">5</span>
                </h4>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Код ТМЦ</th>
                        <th>Наименование</th>
                        <th>Ед. изм.</th>
                        <th class="text-end">Количество</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${entry.value}">
                        <td th:text="${item.tmcCode}">SIZ-001</td>
                        <td th:text="${item.tmcName}">Костюм мужской х/б</td>
                        <td th:text="${item.unit}">компл</td>
                        <td class="text-end fw-bold" th:text="${item.requiredQuantity}">10</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:if="${report.isEmpty()}">
        <div class="alert alert-warning">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <strong>Нет данных.</strong> За выбранный период нет кадровых изменений или не заданы нормы выдачи.
        </div>
        <a href="/staffing-plans/upload" class="btn btn-primary">
            <i class="bi bi-upload"></i> Загрузить кадровый план
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
