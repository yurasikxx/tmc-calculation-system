<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-person-circle me-2"></i>Профиль пользователя</h4>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">ФИО</div>
                        <div class="col-sm-8"
                             th:text="${user.employee != null ? user.employee.fullName : user.username}">
                            Иванов И.И.
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">Логин</div>
                        <div class="col-sm-8" th:text="${user.username}">admin</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 fw-bold">Роль</div>
                        <div class="col-sm-8">
                            <span class="badge bg-primary" th:text="${roleName}">Администратор</span>
                        </div>
                    </div>
                    <div class="row mb-3" th:if="${user.employee != null}">
                        <div class="col-sm-4 fw-bold">Профессия</div>
                        <div class="col-sm-8" th:text="${user.employee.profession.name}">Инженер</div>
                    </div>
                    <div class="row mb-3" th:if="${user.employee != null}">
                        <div class="col-sm-4 fw-bold">Подразделение</div>
                        <div class="col-sm-8" th:text="${user.employee.department.name}">Управление</div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mt-4">
                <div class="card-header bg-warning">
                    <h5 class="mb-0"><i class="bi bi-key me-2"></i>Смена пароля</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/profile/change-password}" method="post">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Текущий пароль</label>
                            <input type="password" class="form-control" id="currentPassword" name="currentPassword"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Новый пароль</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Подтверждение нового пароля</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                   required>
                        </div>
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-save"></i> Сменить пароль
                        </button>
                    </form>
                </div>
            </div>

            <div class="mt-3">
                <a href="/" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> На главную
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
