<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список сотрудников</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Список сотрудников</h2>
        <a href="/employees/create" class="btn btn-primary">Добавить сотрудника</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>Профессия</th>
            <th>Подразделение</th>
            <th>Дата приёма</th>
            <th style="width: 200px;">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}">1</td>
            <td th:text="${emp.fullName}">Иванов Иван Иванович</td>
            <td th:text="${emp.profession.name}">Токарь 5 разряда</td>
            <td th:text="${emp.department.name}">Цех №3</td>
            <td th:text="${emp.hireDate}">2024-01-15</td>
            <td>
                <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-warning">Изменить</a>
                <form th:action="@{/employees/delete/{id}(id=${emp.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Удалить сотрудника?')">
                        Удалить
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${employees.isEmpty()}">
            <td colspan="6" class="text-center text-muted">Нет сотрудников</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
