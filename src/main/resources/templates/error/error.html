<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorCode} + ' - ' + ${errorMessage}">Ошибка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1 class="display-1 text-muted" th:text="${errorCode}">404</h1>
            <h2 class="text-muted" th:text="${errorMessage}">Страница не найдена</h2>
            <p class="lead" th:text="${errorDescription}">Извините, но запрашиваемая страница не существует.</p>
            <a href="/" class="btn btn-primary btn-lg mt-3">
                <i class="bi bi-house"></i> На главную
            </a>
        </div>
    </div>
</div>

</body>
</html>
