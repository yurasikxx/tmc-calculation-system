<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация</title>
</head>
<body>
<div th:fragment="navbar">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-boxes"></i>
                ТМЦ-система
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                    <li class="nav-item" sec:authorize="hasAnyRole('LABOR', 'ADMIN')">
                        <a class="nav-link" href="/departments">Подразделения</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('LABOR', 'ADMIN')">
                        <a class="nav-link" href="/professions">Профессии</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('LABOR', 'ADMIN', 'MTS')">
                        <a class="nav-link" href="/employees">Сотрудники</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('OT', 'STOREKEEPER', 'TECHNOLOG', 'ADMIN')">
                        <a class="nav-link" href="/tmc-items">ТМЦ</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('OT', 'STOREKEEPER', 'TECHNOLOG', 'ADMIN')">
                        <a class="nav-link" href="/norms">Нормы</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('MTS')">
                        <a class="nav-link" href="/calculations">Расчёт</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" href="/users">Пользователи</a>
                    </li>
                </ul>

                <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                           data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i>
                            <span th:text="${currentUser != null ? currentUser.employeeFullNameWithInitials : currentUser.username}">Пользователь</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                    <span class="dropdown-item-text">
                                        <i class="bi bi-person"></i>
                                        <span th:text="${currentUser != null ? currentUser.employeeFullNameWithInitials : currentUser.username}">Иванов И.И.</span>
                                    </span>
                            </li>
                            <li>
                                    <span class="dropdown-item-text">
                                        <i class="bi bi-shield"></i>
                                        <span th:text="${currentUserRoleName}">Инженер</span>
                                    </span>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="/logout">
                                    <i class="bi bi-box-arrow-right text-danger"></i> Выйти
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
